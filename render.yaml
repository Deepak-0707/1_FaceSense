services:
  - type: web
    name: facesense-backend
    env: node
    region: oregon            
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false           
      - key: FRONTEND_URL
        sync: false           
